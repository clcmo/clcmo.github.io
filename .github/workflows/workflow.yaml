name: Gerar versão do projeto
run-name: ${{ github.actor }} está gerando uma nova versão do projeto

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para semantic-release
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do root (se existir)
        run: npm install --if-present
        continue-on-error: true

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: npm ci

      - name: Executar Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
name: Build e Deploy utilizando TypeScript para GitHub Pages
run-name: ${{ github.actor }} está construindo e fazendo deploy do site para GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm install

      - name: Build do projeto
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://your-api-url.com/api' }}
          REACT_APP_GITHUB_USERNAME: clcmo
          REACT_APP_PIX_KEY: ${{ secrets.REACT_APP_PIX_KEY || 'seu-pix@example.com' }}

      - name: Verificar conteúdo do build
        run: ls -la frontend/build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Build e Deploy (Expo Router Web) para GitHub Pages
run-name: ${{ github.actor }} está construindo e fazendo deploy para GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Gerar snapshot dos projetos públicos do GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: clcmo
        run: node scripts/generate-projects-snapshot.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Preservar domínio personalizado do Pages
        run: cp CNAME frontend/public/CNAME

      - name: Export Web (Expo Router)
        working-directory: ./frontend
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_GITHUB_USERNAME: clcmo
          NODE_ENV: production

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

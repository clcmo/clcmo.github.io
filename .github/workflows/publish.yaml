name: Build e Deploy (Expo Router Web) para GitHub Pages
run-name: ${{ github.actor }} está construindo e fazendo deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js (com cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (raiz)
        run: npm ci

      - name: Export Web (Expo Router)
        working-directory: ./frontend
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GITHUB_USERNAME: clcmo
          NODE_ENV: production

      - name: Verificar conteúdo do dist
        run: |
          echo "📦 Conteúdo do dist:"
          ls -la frontend/dist
          echo "📄 Arquivos principais:"
          find frontend/dist -name "*.html" -o -name "*.js" | head -10

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
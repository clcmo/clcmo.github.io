name: Build e Deploy (Expo Router Web) para GitHub Pages
run-name: ${{ github.actor }} está construindo e fazendo deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar snapshot dos projetos para o fallback web
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Configure o secret API_URL com a URL base da API, sem /api."
            exit 1
          fi
          case "$API_URL" in
            */api|*/api/)
              echo "::error::API_URL deve conter somente a URL base, sem /api."
              exit 1
              ;;
          esac
          API_BASE_URL="${API_URL%/}"
          curl --retry 5 --retry-connrefused --retry-delay 2 -fsS \
            "$API_BASE_URL/api/projects" \
            -o frontend/public/projects.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('frontend/public/projects.json','utf8')); if(!Array.isArray(data)) process.exit(1);"

      - name: Export Web (Expo Router)
        working-directory: ./frontend
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_GITHUB_USERNAME: clcmo
          NODE_ENV: production

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

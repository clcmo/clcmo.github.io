name: Sincronizar projetos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validar configuração
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Configure o secret API_URL sem o sufixo /api."
            exit 1
          fi
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::Configure o secret ADMIN_SECRET com o mesmo valor da API."
            exit 1
          fi
          case "$API_URL" in
            */api|*/api/)
              echo "::error::API_URL deve conter somente a URL base, sem /api."
              exit 1
              ;;
          esac

      - name: Acordar e aguardar a API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          ready=false
          for attempt in $(seq 1 12); do
            if curl --max-time 10 -fsS "$API_URL/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::A API não ficou disponível."
            exit 1
          fi

      - name: Sincronizar GitHub com MongoDB via Prisma
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          curl --retry 2 --retry-delay 3 --max-time 120 -fsS \
            -X POST "$API_URL/api/github/sync" \
            -H "x-admin-secret: $ADMIN_SECRET"

      - name: Disparar publicação do snapshot no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run publish.yaml --repo "$REPOSITORY" --ref main
